name: Sync featured projects

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-featured
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Install scripts deps
        run: pnpm install --filter @zachhandley/scripts --ignore-scripts

      # APPWRITE_ENDPOINT / APPWRITE_PROJECT_ID are deliberately not passed: they
      # are public (they ship to the browser) and the script defaults them to the
      # same values as website/src/env.ts. Wiring them as secrets is what broke
      # this job — they resolved to empty strings and the script hard-failed on
      # `Missing required env var: APPWRITE_ENDPOINT` before it ever reached the
      # one value that is actually secret.
      #
      # Without APPWRITE_API_KEY the script runs read-only: the README is still
      # regenerated from the world-readable `links` table, and the Appwrite
      # write-back is skipped and reported in the job summary.
      - name: Run sync
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --filter @zachhandley/scripts sync:featured

      - name: Open PR if README changed
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "sync: regenerate featured project blocks in README"
          title: "sync: featured projects"
          body: |
            Auto-generated by `.github/workflows/sync-featured.yml`.

            The `<!-- featured:rust:start -->` and `<!-- featured:typescript:start -->` regions in `README.md` were regenerated from the current featured rows in Appwrite + their live GitHub metadata.
          branch: sync/featured-projects
          delete-branch: true
          add-paths: README.md
