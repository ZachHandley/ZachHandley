name: Sync featured projects

on:
  schedule:
    - cron: "0 */6 * * *"  # every 6 hours
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-featured
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Install scripts deps
        run: pnpm install --filter @zachhandley/scripts --ignore-scripts

      - name: Run sync
        env:
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --filter @zachhandley/scripts sync:featured

      - name: Open PR if README changed
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "sync: regenerate featured project blocks in README"
          title: "sync: featured projects"
          body: |
            Auto-generated by `.github/workflows/sync-featured.yml`.

            The `<!-- featured:rust:start -->` and `<!-- featured:typescript:start -->` regions in `README.md` were regenerated from the current featured rows in Appwrite + their live GitHub metadata.
          branch: sync/featured-projects
          delete-branch: true
          add-paths: README.md
