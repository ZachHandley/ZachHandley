name: Deploy dev to Cloudflare Workers

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build & deploy zachhandley-dev
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm -C website build

      - name: Deploy zachhandley-dev Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
          command: deploy --config dist/server/wrangler.json --name zachhandley-dev

      # See the equivalent step in deploy-prod.yml for why this is a plain run
      # step rather than the wrangler-action `secrets:` input. It matters most
      # here: that input never forwards `--name`, so it would read
      # website/wrangler.toml, resolve "zachhandley", and write this key onto the
      # PRODUCTION Worker on every push to dev. `--name zachhandley-dev` below is
      # load-bearing and must stay in sync with the deploy command above.
      - name: Sync Worker secrets
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: |
          if [ -z "$APPWRITE_API_KEY" ]; then
            echo "::warning::APPWRITE_API_KEY is not set in repo secrets - leaving the Worker's existing secrets untouched."
            exit 0
          fi
          jq -n --arg v "$APPWRITE_API_KEY" '{APPWRITE_API_KEY: $v}' \
            | pnpm exec wrangler secret bulk --config dist/server/wrangler.json --name zachhandley-dev
