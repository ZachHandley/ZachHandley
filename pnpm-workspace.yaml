packages:
  - website
  - packages/*
  - scripts

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  '@tailwindcss/oxide': true
  esbuild: true
  sharp: true
  workerd: true

overrides:
  # Pins one three across website + centerthree + @newkrok/three-particles.
  # Bump here first: the override wins over any `pnpm add three@...`.
  three: ^0.185.1

confirmModulesPurge: false
